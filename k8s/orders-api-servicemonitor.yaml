apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: orders-api
  namespace: monitoring
  labels:
    release: prometheus  
spec:
  selector:
    matchLabels:
      app: orders-api     
  namespaceSelector:
    matchNames:
      - default           
  endpoints:
    - port: http          
      path: /metrics
      interval: 15s
